<div class="product-grid">
  <h2>Catálogo de Productos</h2>
  <div *ngFor="let product of products" class="product-card" style="border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem;">
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>
    <p><strong>Precio:</strong> {{ product.price | currency:'GTQ' }}</p>
    <button (click)="onAddToCart(product)">Agregar al Carrito</button>
  </div>
</div>
